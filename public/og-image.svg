  <rect x="920" y="540" width="270" height="40" rx="20" fill="#00e676" fill-opacity="0.07" stroke="#00e676" stroke-width="1" stroke-opacity="0.2"/>
  <text x="1055" y="565" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#00e676">✓  GOVERNMENT ACCREDITED</text>

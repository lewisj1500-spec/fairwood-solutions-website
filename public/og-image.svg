<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');</style>
    <radialGradient id="glow1" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#00bcd4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00e676" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#030804"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" stroke="#00e676" stroke-width="1" stroke-opacity="0.1" fill="none"/>

  <!-- Left accent line -->
  <rect x="80" y="155" width="3" height="320" rx="2" fill="#00e676" opacity="0.25"/>

  <!-- ── LOGO ROW (icon + "Fairwood Solutions" on one line) ── -->
  <!-- Icon: 96×96, vertically centred with text -->
  <rect x="110" y="160" width="96" height="96" rx="22" fill="#00e676"/>
  <svg x="134" y="184" width="48" height="48" viewBox="0 0 24 24">
    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" fill="#030804"/>
  </svg>


  <text x="110" y="458" font-family="'Space Grotesk', Arial, sans-serif" font-size="44" font-weight="700" fill="#00e676" letter-spacing="-1">24hr</text>
  <text x="110" y="488" font-family="'Space Grotesk', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#4a7a4d">TURNAROUND</text>

  <rect x="268" y="435" width="1" height="58" fill="#00e676" opacity="0.12"/>

  <text x="292" y="458" font-family="'Space Grotesk', Arial, sans-serif" font-size="44" font-weight="700" fill="#00e676" letter-spacing="-1">98%</text>
  <text x="292" y="488" font-family="'Space Grotesk', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#4a7a4d">SATISFACTION</text>

  <rect x="460" y="435" width="1" height="58" fill="#00e676" opacity="0.12"/>

  <text x="484" y="458" font-family="'Space Grotesk', Arial, sans-serif" font-size="44" font-weight="700" fill="#00e676" letter-spacing="-1">20+</text>
  <text x="484" y="488" font-family="'Space Grotesk', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#4a7a4d">YRS EXPERIENCE</text>

